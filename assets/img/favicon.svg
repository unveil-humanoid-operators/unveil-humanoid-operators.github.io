<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#2c3e6b"/>
  <!-- Neural-network mark replicating assets/img/logo.png: 1-4-2 layer graph
       with hollow (outline) nodes. Edges drawn first; nodes are tile-navy
       filled circles with white stroke so edges terminate at node rims. -->
  <g stroke="#ffffff" stroke-width="1.2" stroke-linecap="round">
    <line x1="5.4"  y1="16.2" x2="15.2" y2="5.4"/>
    <line x1="5.4"  y1="16.2" x2="15.4" y2="12.3"/>
    <line x1="5.4"  y1="16.2" x2="15.6" y2="19.3"/>
    <line x1="5.4"  y1="16.2" x2="14.9" y2="27"/>
    <line x1="15.2" y1="5.4"  x2="26.8" y2="10.7"/>
    <line x1="15.4" y1="12.3" x2="26.8" y2="10.7"/>
    <line x1="15.4" y1="12.3" x2="27"   y2="20.8"/>
    <line x1="15.6" y1="19.3" x2="26.8" y2="10.7"/>
    <line x1="15.6" y1="19.3" x2="27"   y2="20.8"/>
    <line x1="14.9" y1="27"   x2="27"   y2="20.8"/>
  </g>
  <g fill="#2c3e6b" stroke="#ffffff" stroke-width="1.5">
    <circle cx="5.4"  cy="16.2" r="2.6"/>
    <circle cx="15.2" cy="5.4"  r="2.6"/>
    <circle cx="15.4" cy="12.3" r="2.6"/>
    <circle cx="15.6" cy="19.3" r="2.6"/>
    <circle cx="14.9" cy="27"   r="2.6"/>
    <circle cx="26.8" cy="10.7" r="2.6"/>
    <circle cx="27"   cy="20.8" r="2.6"/>
  </g>
</svg>
